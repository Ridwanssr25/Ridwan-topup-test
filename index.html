<!DOCTYPE html>
<html lang="id">
<head>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-select { @apply border-2 border-indigo-500 bg-indigo-950/40 text-white shadow-lg shadow-indigo-500/20; }
        .card-unselect { @apply border border-slate-800 bg-slate-900 text-slate-300 hover:border-slate-700; }

        .game-card-unselect { @apply border border-slate-800/80 bg-slate-900 hover:border-slate-700 hover:scale-[1.01]; }

</head>

            <div class="flex items-center gap-3 cursor-pointer" onclick="resetForm()">
